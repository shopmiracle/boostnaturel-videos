name: fetch-assets
on:
  push:
    paths: ['assets/urls.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharge les visuels listés (CDN Shopify uniquement)
        run: |
          while read -r name url; do
            [ -z "$name" ] && continue
            case "$url" in https://cdn.shopify.com/*) ;; *) echo "URL refusée: $url"; exit 1;; esac
            case "$name" in */*|..*) echo "Nom refusé: $name"; exit 1;; esac
            curl -fsSL "$url" -o "assets/$name"
          done < assets/urls.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Récupère les visuels produits" || exit 0
          git push
