<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:P;font-weight:500;src:url(p500.ttf)}
@font-face{font-family:P;font-weight:600;src:url(p600.ttf)}
@font-face{font-family:P;font-weight:700;src:url(p700.ttf)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:P;background:var(--bg0)}
#bg{position:absolute;inset:0;background:linear-gradient(var(--bg0),var(--bg1))}
.a{position:absolute;opacity:0;will-change:transform,opacity}
.c{left:0;width:1080px;text-align:center}
#blob{left:-200px;top:1050px;width:1480px;height:1480px;border-radius:50%;background:var(--ebg0);opacity:.55}
#glow{left:90px;top:330px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,#fff 40%,#fff0 70%)}
#box{left:130px;top:350px;width:820px;height:880px;mix-blend-mode:multiply}
#prod{width:100%;height:100%;object-fit:contain}
#sh{left:300px;top:1235px;width:480px;height:50px;border-radius:50%;background:var(--ink);filter:blur(24px)}
#brand{top:130px;font:700 40px P;letter-spacing:10px;color:var(--ink);text-transform:uppercase}
#nm{top:1305px;left:60px;width:960px;font:700 84px/1.08 P;color:var(--ink);text-align:center}
#nm span{display:inline-block;opacity:0;margin:0 .06em}
#dt{top:1535px;left:80px;width:920px;font:500 46px/1.25 P;color:var(--ink2);text-align:center}
#pr{top:1330px;font:700 150px P;color:var(--ink)}
#cta{top:1560px;left:190px;width:700px;height:120px;border-radius:60px;background:var(--ink);color:#fff;font:700 52px/120px P;text-align:center}
#foot{position:absolute;left:60px;width:960px;bottom:60px;box-sizing:border-box;padding:14px 20px;text-align:center;font:500 25px/1.3 P;color:var(--ink);background:rgba(255,255,255,.8);border-radius:20px}
</style>
<div id="bg"></div><div class="a" id="blob"></div><div class="a" id="glow"></div><div class="a" id="sh"></div>
<div class="a" id="box"><img id="prod"></div>
<div class="a c" id="brand"></div><div id="nm" class="a"></div><div class="a" id="dt"></div>
<div class="a c" id="pr"></div><div class="a" id="cta">boostnaturel.com</div><div id="foot"></div>
<script src="product.js"></script><script>
const $=id=>document.getElementById(id);
const e=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
const PALS={lilas:['#E4D8F7','#A48BD0','#3B2466','#8A6BC8','#4a3a70','#FBF6EE','#EFE4D4'],menthe:['#DDF1E6','#8CC8A8','#1F4A38','#3E8E6A','#2f5d49','#F4FAF6','#E3EFE7'],
 rose:['#FBE1E8','#E79BB0','#6A2140','#C0527A','#7a3552','#FFF5F7','#F6E3E8'],bleu:['#DCE8F8','#86A8DC','#1D3566','#4A73C0','#2d467a','#F3F7FD','#E1EAF6'],sable:['#F6EBD9','#D9B98A','#4A3418','#A8782F','#5c4528','#FBF6EE','#EFE4D4']};
const PAL=PALS[new URLSearchParams(location.search).get('pal')]||PALS.lilas;
['bg0','bg1','ink','acc','ink2','ebg0','ebg1'].forEach((k,i)=>document.documentElement.style.setProperty('--'+k,PAL[i]));
$('prod').src=CP.img;$('brand').textContent=CP.brand;$('dt').textContent=CP.detail;$('pr').textContent=CP.price;$('foot').textContent=CP.foot;
$('nm').innerHTML=CP.name.split(' ').map(w=>'<span>'+w+'</span>').join(' ');
const IN=(el,t,a,dy,d=.6)=>{const k=e((t-a)/d);el.style.opacity=k;el.style.transform=`translateY(${(1-k)*dy}px)`;return k};
function render(t){
 IN($('blob'),t,0,0,1);IN($('glow'),t,0,0,1);
 const k=e((t-.2)/1.0),bx=$('box');bx.style.opacity=Math.min(1,k*3);
 const out=e((t-8.2)/.7); // le produit remonte et se rétrécit pour laisser la place au prix
 bx.style.transform=`translateY(${(1-k)*600+Math.sin(t*1.8)*10-out*140}px) scale(${1-out*.18}) rotate(${Math.sin(t*1.1)*1.2}deg)`;
 $('sh').style.opacity=.28*k*(1-out);$('glow').style.transform=`translateY(${-out*140}px) scale(${1-out*.18})`;
 IN($('brand'),t,.4,-30);
 const nm=$('nm'),spans=[...nm.children];nm.style.opacity=Math.min(1,e((8-t)/.4));
 spans.forEach((s,i)=>{const q=e((t-1.2-i*.14)/.5);s.style.opacity=q;s.style.transform=`translateY(${(1-q)*40}px)`});
 const dt=$('dt');dt.style.opacity=Math.min(e((t-2.4)/.5),e((8-t)/.4));dt.style.transform=`translateY(${(1-e((t-2.4)/.5))*30}px)`;
 IN($('pr'),t,8.6,40);IN($('cta'),t,9.2,40);
}
render(0);
</script>
