<!doctype html><meta charset="utf-8"><style>
body{background:var(--bg0)}
.sh{border-radius:50%}
#c1{left:-200px;top:-150px;width:700px;height:700px;background:var(--bg1)}
#c2{left:700px;top:1250px;width:600px;height:600px;background:var(--bg1)}
#c3{left:820px;top:120px;width:260px;height:260px;background:var(--acc)}
#c4{left:40px;top:1480px;width:200px;height:200px;background:var(--ink)}
#pol{left:150px;top:330px;width:780px;height:900px;background:#fff;box-shadow:0 30px 60px #0003;border-radius:18px}
#pol img{position:absolute;left:30px;top:30px;width:720px;height:720px;object-fit:contain}
#pol .cap{position:absolute;left:0;width:780px;top:780px;text-align:center;font:600 34px P;letter-spacing:6px;color:var(--ink2);text-transform:uppercase}
#tape{left:380px;top:290px;width:320px;height:80px;background:#ffffffaa;box-shadow:0 4px 10px #0002;transform:rotate(-4deg)}
#nm{left:60px;top:1230px;width:720px;padding:26px 34px;background:var(--ink);color:#fff;font:700 64px/1.1 P;transform-origin:left}
#dt{left:420px;top:1480px;width:600px;padding:22px 30px;background:#fff;color:var(--ink);font:500 38px/1.25 P;border-radius:22px;box-shadow:0 14px 30px #0002}
#st{left:760px;top:1020px;width:300px;height:300px;color:#fff;font:700 62px/300px P;text-align:center}
#st:before{content:"";position:absolute;inset:0;background:var(--acc);clip-path:polygon(50% 0,61% 15%,79% 9%,81% 28%,98% 35%,88% 51%,98% 67%,80% 73%,79% 91%,61% 85%,50% 100%,39% 85%,21% 91%,19% 73%,2% 67%,12% 51%,2% 35%,19% 28%,21% 9%,39% 15%);z-index:-1}
#hd{left:60px;top:90px;width:760px;font:700 100px/1 P;color:var(--ink);text-transform:uppercase}
#hd small{display:block;margin-top:14px;font:600 34px P;letter-spacing:8px;color:var(--ink2)}
#foot{position:absolute;left:60px;width:960px;bottom:34px;text-align:center;font:500 22px/1.3 P;color:var(--ink2)}
</style>
<div class="a sh" id="c1"></div><div class="a sh" id="c2"></div><div class="a sh" id="c3"></div><div class="a sh" id="c4"></div>
<div class="a" id="hd"></div><div class="a" id="pol"><img id="p"><div class="cap" id="cp"></div></div><div class="a" id="tape"></div>
<div class="a" id="nm"></div><div class="a" id="dt"></div><div class="a" id="st"></div><div id="foot"></div>
<script src="common.js"></script><script src="product.js"></script><script>
$('p').src=CP.img;$('cp').textContent=CP.brand;$('hd').innerHTML=CP.brand+'<small>Sélection du jour</small>';$('nm').textContent=CP.name;$('dt').textContent=CP.detail;$('st').textContent=CP.price;$('foot').textContent=CP.foot;
const pop=(el,t,a,rot,from)=>{const k=Math.min(1,Math.max(0,(t-a)/.6)),b=k<1?1-Math.pow(1-k,3)*Math.cos(k*9):1;el.style.opacity=Math.min(1,k*4);el.style.transform=`translate(${(1-b)*from[0]}px,${(1-b)*from[1]}px) rotate(${rot+(1-b)*-12}deg) scale(${.5+b*.5})`};
function render(t){
 pop($('c1'),t,0,0,[-200,-200]);pop($('c2'),t,.1,0,[300,300]);pop($('c3'),t,.2,0,[200,-100]);pop($('c4'),t,.3,0,[-200,200]);
 pop($('hd'),t,.4,-2,[-300,0]);pop($('pol'),t,.9,-3+Math.sin(t*1.2)*.6,[0,700]);pop($('tape'),t,1.5,-4,[0,-100]);
 pop($('nm'),t,2,-2,[-600,0]);pop($('dt'),t,2.8,2,[600,0]);pop($('st'),t,3.6,8,[300,-300]);
}
render(0);
</script>
