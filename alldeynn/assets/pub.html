<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:P;font-weight:500;src:url(p500.ttf)}
@font-face{font-family:P;font-weight:600;src:url(p600.ttf)}
@font-face{font-family:P;font-weight:700;src:url(p700.ttf)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:P}
body{position:relative;background:#DCCDF1}
#bg2{position:absolute;inset:0}
#bg1{position:absolute;inset:0;background:linear-gradient(var(--bg0),var(--bg1))}
#prod{position:absolute;left:190px;top:520px;width:700px;height:700px;mix-blend-mode:multiply;will-change:transform}
#glow{position:absolute;left:90px;top:430px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,#fff 35%,#ffffff00 70%)}
#sh{position:absolute;left:340px;top:1215px;width:400px;height:50px;border-radius:50%;background:var(--ink);filter:blur(24px);opacity:.28}
.fr{position:absolute;opacity:0;will-change:transform}
.l{position:absolute;left:30px;width:1020px;text-align:center;color:var(--ink);font:700 100px/1.1 P;white-space:nowrap}
.l.m{font-weight:600;font-size:64px;line-height:1.2}
.l span{display:inline-block;opacity:0;transform:translateY(40px);margin:0 .12em}
#brand{position:absolute;top:110px;left:0;width:1080px;text-align:center;font:700 40px P;letter-spacing:10px;color:#fff}
#foot{position:absolute;bottom:70px;left:60px;width:960px;text-align:center;font:500 28px/1.3 P;color:var(--ink2)}
#cta{position:absolute;left:190px;top:1480px;width:700px;height:120px;border-radius:60px;background:var(--ink);color:#fff;font:700 52px/120px P;text-align:center;opacity:0}
#price{position:absolute;top:1320px;width:1080px;text-align:center;font:700 96px P;color:var(--ink);opacity:0}
</style>
<div id="bg2"></div><div id="bg1"></div>
<div id="brand">ALLDEYNN</div>
<div id="glow"></div><div id="sh"></div><img id="prod">
<div class="fr" id="f1"></div><div class="fr" id="f2"></div>
<div id="L"></div><div id="price"></div><div id="cta">boostnaturel.com</div>
<div id="foot"></div>
<script src="products.js"></script><script>
const $=id=>document.getElementById(id);
$('prod').src=C.img;$('price').textContent=C.price;$('foot').textContent=C.foot;
$('bg2').style.background=`linear-gradient(${C.tint[0]},${C.tint[1]})`;
const FP=[['left:60px;top:1130px;width:300px;height:300px',-12],['left:740px;top:1180px;width:270px;height:270px',10]];
C.fruits.forEach((k,i)=>{const el=$('f'+(i+1));el.style.cssText+=FP[C.fruits.length===1?0:i][0];el.innerHTML=fruitSVG(k)});
const e=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
const pop=x=>{const q=Math.min(1,Math.max(0,x));return q<1?e(q)*1.12-Math.sin(q*3.14)*0.12:1};
const HL=hookLines(HOOK);const T=[[HL[0],0.2,2.6,200,""],[HL[1],0.7,2.6,330,""],
 [C.msgs[0][0],3.0,5.6,200,""],[C.msgs[0][1],3.5,5.6,330,"m"],
 [C.msgs[1][0],6.0,8.6,200,""],[C.msgs[1][1],6.5,8.6,330,"m"],
 [C.msgs[2][0],9.0,11.6,220,"m"],[C.msgs[2][1],9.5,11.6,310,"m"],
 [C.name,12.0,15,200,""]];
const L=$('L');
T.forEach(r=>{const d=document.createElement('div');d.className='l '+r[4];d.style.top=r[3]+'px';
 if(!r[4])d.style.fontSize=Math.min(100,Math.floor(1000/(r[0].length*0.6)))+'px';d.innerHTML=r[0].split(' ').map(w=>'<span>'+w+'</span>').join(' ');L.appendChild(d);r.push(d)});
function render(t){
 const k=e((t-5.6)/0.6)-e((t-8.8)/0.6);$('bg1').style.opacity=1-k;
 const rise=e(t/1.0),y=(1-rise)*500+Math.sin(t*1.8)*14,rot=Math.sin(t*1.1)*1.6;
 const p=$('prod');p.style.opacity=rise;p.style.transform=`translateY(${y}px) rotate(${rot}deg)`;
 const s=$('sh');s.style.opacity=.28*rise;s.style.transform=`scaleX(${1-Math.sin(t*1.8)*.06})`;
 C.fruits.forEach((_,i)=>{const el=$('f'+(i+1)),a=6.3+i*0.25,q=pop((t-a)/0.5),r=(i?10:-12)+Math.sin(t*2+a)*3;
  el.style.opacity=t<a?0:Math.min(1,q*2,e((8.6-t)/0.35));el.style.transform=`scale(${q}) rotate(${r}deg)`});
 T.forEach(r=>{const [,a,b,,,el]=r;[...el.children].forEach((w,i)=>{const q=e((t-a-i*0.15)/0.45),o=Math.min(q,e((b-t)/0.35));
  w.style.opacity=t<a?0:o;w.style.transform=`translateY(${(1-q)*40}px)`})});
 $('price').style.opacity=e((t-12.2)/0.5);
 $('cta').style.opacity=e((t-12.7)/0.5);$('cta').style.transform=`translateY(${(1-e((t-12.7)/0.5))*40}px)`;
}
render(0);
</script>
