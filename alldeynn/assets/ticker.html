<!doctype html><meta charset="utf-8"><style>
body{background:var(--bg0)}
.row{position:absolute;left:0;white-space:nowrap;font:700 240px/1 P;text-transform:uppercase;opacity:0}
.o{color:transparent;-webkit-text-stroke:4px var(--ink)}.f{color:var(--ink)}.c{color:var(--acc)}
#ring{left:240px;top:560px;width:600px;height:600px;border-radius:50%;background:var(--bg0);box-shadow:0 0 0 14px var(--ink)}
#box{left:240px;top:560px;width:600px;height:600px;border-radius:50%;overflow:hidden;mix-blend-mode:multiply}#prod{width:100%;height:100%;object-fit:contain;padding:40px;box-sizing:border-box}
#band{left:0;top:1260px;width:1080px;height:400px;background:var(--ink)}
#nm{left:60px;width:960px;top:1300px;text-align:center;font:700 84px/1.08 P;color:#fff}
#dt{left:80px;width:920px;top:1480px;text-align:center;font:500 40px/1.25 P;color:var(--bg1)}
#pr{left:0;width:1080px;top:1668px;text-align:center;font:700 96px P;color:var(--ink)}
#foot{position:absolute;left:60px;width:960px;bottom:30px;text-align:center;font:500 22px/1.3 P;color:var(--ink2)}
</style>
<div class="a row o" id="r1" style="top:80px"></div><div class="a row f" id="r2" style="top:340px"></div><div class="a row c" id="r3" style="top:600px"></div>
<div class="a row o" id="r4" style="top:860px"></div><div class="a row f" id="r5" style="top:1120px"></div>
<div class="a" id="ring"></div><div class="a" id="box"><img id="prod"></div><div class="a" id="band"></div>
<div class="a" id="nm"></div><div class="a" id="dt"></div><div class="a" id="pr"></div><div id="foot"></div>
<script src="common.js"></script><script src="product.js"></script><script>
$('prod').src=CP.img;$('nm').textContent=CP.name;$('dt').textContent=CP.detail;$('pr').textContent=CP.price;$('foot').textContent=CP.foot;
const word=(CP.brand.toUpperCase()+' · ').repeat(6);['r1','r2','r3','r4','r5'].forEach(i=>$(i).textContent=word);
function render(t){
 ['r1','r2','r3','r4','r5'].forEach((id,i)=>{const el=$(id);el.style.opacity=Math.min(1,t*2-i*.1);const x=(t*(180+i*40))%1500*(i%2?1:-1)-(i%2?1500:0);el.style.transform=`translateX(${x}px)`});
 const r=e((t-.8)/.6);$('ring').style.opacity=r;$('ring').style.transform=`scale(${.3+r*.7})`;
 const k=e((t-1)/.9);$('box').style.opacity=k;$('box').style.transform=`translateY(${(1-k)*500}px) rotate(${Math.sin(t*1.4)*2}deg)`;
 const b=e((t-1.8)/.6);$('band').style.opacity=1;$('band').style.transform=`translateY(${(1-b)*600}px)`;
 IN($('nm'),t,2.5,40);IN($('dt'),t,3.3,30);const p=e((t-4)/.5);$('pr').style.opacity=p;$('pr').style.transform=`scale(${.6+p*.4})`;
}
render(0);
</script>
