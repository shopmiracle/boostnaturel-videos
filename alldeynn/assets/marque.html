<!doctype html><meta charset="utf-8"><style>
body{background:var(--ink)}
#kick{left:0;width:1080px;top:130px;text-align:center;font:600 36px P;letter-spacing:12px;color:var(--bg1);text-transform:uppercase}
.big{left:-40px;white-space:nowrap;font:700 330px/1 P;text-transform:uppercase;color:transparent;-webkit-text-stroke:3px var(--bg1)}
#ring{left:140px;top:560px;width:800px;height:800px;border-radius:50%;background:var(--bg0)}
#box{left:140px;top:560px;width:800px;height:800px;border-radius:50%;overflow:hidden;mix-blend-mode:multiply}#prod{width:100%;height:100%;object-fit:contain;padding:50px;box-sizing:border-box}
#nm{left:60px;width:960px;top:1450px;text-align:center;font:700 80px/1.08 P;color:#fff}
#dt{left:80px;width:920px;top:1640px;text-align:center;font:500 42px/1.25 P;color:var(--bg1)}
#pr{left:0;width:1080px;top:1760px;text-align:center;font:700 70px P;color:var(--bg0)}
#foot{position:absolute;left:60px;width:960px;bottom:30px;text-align:center;font:500 22px/1.3 P;color:var(--bg1)}
</style>
<div class="a" id="kick">Marque du jour</div>
<div class="a big" id="b1" style="top:230px"></div><div class="a big" id="b2" style="top:520px"></div><div class="a big" id="b3" style="top:810px"></div>
<div class="a" id="ring"></div><div class="a" id="box"><img id="prod"></div>
<div class="a" id="nm"></div><div class="a" id="dt"></div><div class="a" id="pr"></div><div id="foot"></div>
<script src="common.js"></script><script src="product.js"></script><script>
$('prod').src=CP.img;['b1','b2','b3'].forEach(i=>$(i).textContent=CP.brand.split(' ')[0]);$('nm').textContent=CP.name;$('dt').textContent=CP.detail;$('pr').textContent=CP.price;$('foot').textContent=CP.foot;
function render(t){
 IN($('kick'),t,0,-30);
 ['b1','b2','b3'].forEach((id,i)=>{const k=e((t-.2-i*.25)/.9);const el=$(id);el.style.opacity=k;el.style.transform=`translateX(${(1-k)*(i%2?900:-900)+Math.sin(t*.8+i)*40}px)`});
 const r=e((t-1)/.7);$('ring').style.opacity=r;$('ring').style.transform=`scale(${.3+r*.7})`;
 const k=e((t-1.4)/.9);$('box').style.opacity=k;$('box').style.transform=`translateY(${(1-k)*500}px) rotate(${Math.sin(t*1.3)*1.5}deg)`;
 IN($('nm'),t,2.6,40);IN($('dt'),t,3.4,30);IN($('pr'),t,4.2,30);
}
render(0);
</script>
