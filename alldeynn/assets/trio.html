<!doctype html><meta charset="utf-8"><style>
body{background:linear-gradient(var(--bg0),var(--bg1))}
#ttl{left:0;width:1080px;top:110px;text-align:center;font:700 80px/1.05 P;color:var(--ink)}
#sub{left:0;width:1080px;top:290px;text-align:center;font:600 34px P;letter-spacing:8px;color:var(--ink2);text-transform:uppercase}
.cd{left:70px;width:940px;height:440px;border-radius:40px;background:#fff;box-shadow:0 20px 50px #0002;overflow:hidden}
.cd .im{position:absolute;left:20px;top:20px;width:400px;height:400px;object-fit:contain;mix-blend-mode:multiply}
.cd .n{position:absolute;left:450px;top:50px;font:600 28px P;letter-spacing:5px;color:var(--ink2);text-transform:uppercase;width:470px}
.cd .m{position:absolute;left:450px;top:85px;font:700 46px/1.08 P;color:var(--ink);width:470px}
.cd .p{position:absolute;left:450px;bottom:28px;font:700 56px P;color:var(--acc)}
.cd .d{position:absolute;left:450px;top:215px;font:500 26px/1.25 P;color:var(--ink2);width:470px}
#foot{position:absolute;left:60px;width:960px;bottom:30px;text-align:center;font:500 22px/1.3 P;color:var(--ink2)}
</style>
<div class="a" id="ttl">3 idées<br>du jour</div><div class="a" id="sub">Sélection BoostNaturel</div>
<div id="cards"></div><div id="foot"></div>
<script src="common.js"></script><script src="trio.js"></script><script>
const cards=CPS.map((p,i)=>{const d=document.createElement('div');d.className='a cd';d.style.top=(400+i*490)+'px';
 d.innerHTML=`<img class="im" src="${p.img}"><div class="n">${p.brand}</div><div class="m">${p.name}</div><div class="d">${p.detail}</div><div class="p">${p.price}</div>`;$('cards').appendChild(d);return d});
$('foot').textContent='Compléments alimentaires : respecter la dose recommandée. Ne remplacent pas une alimentation variée.';
function render(t){
 IN($('ttl'),t,0,-50);IN($('sub'),t,.4,0,.5);
 cards.forEach((c,i)=>{const a=1+i*1.2,k=e((t-a)/.8);c.style.opacity=k;c.style.transform=`translateX(${(1-k)*(i%2?900:-900)}px) rotate(${(1-k)*(i%2?6:-6)}deg) translateY(${Math.sin(t*1.5+i)*5}px)`});
}
render(0);
</script>
