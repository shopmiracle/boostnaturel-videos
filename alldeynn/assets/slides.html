<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:P;font-weight:500;src:url(p500.ttf)}
@font-face{font-family:P;font-weight:600;src:url(p600.ttf)}
@font-face{font-family:P;font-weight:700;src:url(p700.ttf)}
@font-face{font-family:PF;font-style:italic;font-weight:400 900;src:url(PlayfairItalic.ttf)}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden;font-family:P;color:var(--ink)}
body{position:relative;background:linear-gradient(var(--ebg0),var(--ebg1))}
#tint{position:absolute;inset:0;opacity:.55}
#brand{position:absolute;top:70px;left:80px;font:700 32px P;letter-spacing:5px;color:var(--acc)}
#num{position:absolute;top:70px;right:80px;font:600 30px P;color:var(--ink2)}
#main{position:absolute;left:80px;width:920px;top:170px;height:960px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.lab{font:600 32px P;letter-spacing:8px;color:var(--acc);margin-bottom:28px}
.big{font:italic 700 96px/1.08 PF,Georgia,serif}
.t{font:700 76px/1.12 P}
.body{font:500 46px/1.4 P;margin-top:34px}
.row{font:600 50px/1.3 P;margin:14px 0}.row small{display:block;font:500 34px P;color:var(--ink2)}
.q{font:italic 700 80px/1.12 PF,Georgia,serif}
.chip{width:92px;height:92px;border-radius:50%;background:var(--ink);color:#fff;font:700 52px/92px P;margin-bottom:30px}
.prod{mix-blend-mode:multiply;max-width:560px;max-height:560px;margin:30px 0}
.th{display:flex;gap:30px;justify-content:center;margin-top:30px}.th img{height:230px;mix-blend-mode:multiply}
.btn{margin-top:40px;padding:0 70px;height:110px;border-radius:55px;background:var(--ink);color:#fff;font:700 50px/110px P}
.price{font:700 88px P;margin-top:10px}
#foot{position:absolute;left:80px;width:920px;bottom:60px;text-align:center;font:500 25px/1.3 P;color:var(--ink2)}
#sw{position:absolute;right:80px;bottom:200px;font:700 44px P;color:var(--acc)}
</style>
<div id="tint"></div><div id="brand">boostnaturel.com</div><div id="num"></div>
<div id="main"></div><div id="sw">→</div><div id="foot"></div>
<script src="products.js"></script><script src="posts_data.js"></script><script>
const $=id=>document.getElementById(id);
const TYPE=QS.get('type')||'edu',P=PRODUCTS;
const IMG=k=>`<img class="prod" src="${P[k].img}">`;
const GEN='Compléments alimentaires : respecter la dose indiquée sur chaque emballage. Avis d’un professionnel de santé en cas de traitement, grossesse ou allaitement.';
const lines=s=>s.replace(/<br>/g,' · ');
// diapositives: tout le texte vient des fiches produits (products.js / posts_data.js), rien d'inventé
function build(type){
 const c=C,pk=PK,POST=POSTS[pk],cta={k:'cta',foot:c.foot};
 if(type==='edu')return [
  {k:'cover',lab:'3 CHOSES À SAVOIR',t:c.name,sub:c.tag,img:pk,foot:c.foot},
  {k:'text',lab:'DANS LE PRODUIT',t:lines(c.edIng),body:c.format,foot:c.foot},
  {k:'steps',lab:'COMMENT LE PRENDRE',rows:c.steps,foot:c.foot},
  {k:'text',lab:'BON À SAVOIR',t:'',body:POST.p,foot:c.foot},
  cta];
 if(type==='qr')return [
  {k:'cover',lab:'VOS QUESTIONS',t:c.name,sub:'on répond en 3 slides',img:pk,foot:c.foot},
  {k:'qa',q:'C’est quoi ?',a:POST.a,foot:c.foot},
  {k:'qa',q:'Comment le prendre ?',a:POST.l,foot:c.foot},
  {k:'qa',q:'Des précautions ?',a:POST.p,foot:c.foot},
  cta];
 const M=[['MATIN & APRÈS-MIDI',['caps','vita']],['AU REPAS',['d3k2','zinc']],['QUAND TU VEUX, TOUJOURS AU MÊME MOMENT',['fish']],['LE SOIR',['sleep']]];
 const when={caps:'3 gélules, 2 fois par jour',vita:'2 comprimés, 2 fois par jour, après le repas',d3k2:'1 capsule par jour, avec de l’eau',zinc:'1 pastille par jour, après un repas',fish:'dans l’eau, un jus ou un smoothie',sleep:'dans l’eau, un jus ou un smoothie'};
 return [{k:'cover',lab:'LA GAMME',t:'Ta journée avec BoostNaturel',sub:'les moments de prise, produit par produit',foot:GEN},
  ...M.map(([l,ks])=>({k:'moment',lab:l,ks,rows:ks.map(k=>[P[k].name,when[k]]),foot:GEN})),
  {k:'cta',foot:GEN,gen:true}];
}
const SL=build(TYPE),N=SL.length;
function show(i){
 const s=SL[i],m=$('main');let h='';
 if(s.k==='cover')h=`<div class="lab">${s.lab}</div><div class="big">${s.t}</div>${s.img?IMG(s.img):''}<div class="body" style="margin-top:0">${s.sub}</div>`;
 if(s.k==='text')h=`<div class="lab">${s.lab}</div>${s.t?`<div class="t">${s.t}</div>`:''}<div class="body">${s.body}</div>`;
 if(s.k==='steps')h=`<div class="lab">${s.lab}</div>${s.rows.map(r=>`<div class="row">${r[0]}<small>${r[1]}</small></div>`).join('')}`;
 if(s.k==='qa')h=`<div class="chip">?</div><div class="q">${s.q}</div><div class="body" style="font-size:${s.a.length>180?40:46}px">${s.a}</div>`;
 if(s.k==='moment')h=`<div class="lab" style="font-size:${s.lab.length>20?28:32}px">${s.lab}</div><div class="th">${s.ks.map(k=>`<img src="${P[k].img}">`).join('')}</div>${s.rows.map(r=>`<div class="row">${r[0]}<small>${r[1]}</small></div>`).join('')}`;
 if(s.k==='cta')h=s.gen?`<div class="big">Toute la gamme</div><div class="body">Fiches, doses et précautions sur le site</div><div class="btn">boostnaturel.com</div>`
  :`${IMG(PK)}<div class="t" style="font-size:64px">${C.name}</div><div class="price">${C.price}</div><div class="btn">boostnaturel.com</div>`;
 m.innerHTML=h;$('foot').textContent=s.foot;$('num').textContent=(i+1)+' / '+N;$('sw').style.display=i<N-1?'block':'none';
 $('tint').style.background=`linear-gradient(${C.tint[0]},${C.tint[1]})`;
}
show(0);
</script>
