<!doctype html><meta charset="utf-8"><style>
body{background:var(--ink)}
.sc{position:absolute;inset:0;display:none;overflow:hidden}
.t{position:absolute;left:40px;width:1000px;text-align:center;font-weight:700;line-height:1.02}
#s1{background:var(--bg1)}#s2{background:var(--bg0)}#s3{background:var(--ink)}#s4{background:var(--acc)}#s5{background:var(--bg0)}
#s1 .t{top:840px;font-size:150px;color:var(--ink);text-transform:uppercase}
#s2 .bx{position:absolute;left:140px;top:300px;width:800px;height:1000px;mix-blend-mode:multiply}#s2 img{width:100%;height:100%;object-fit:contain}
#s2 .k{top:1420px;font-size:44px;letter-spacing:10px;color:var(--ink);text-transform:uppercase}
#s3 .t{top:800px;font-size:130px;color:#fff}
#s4 .t{top:760px;font-size:84px;line-height:1.15;color:#fff}
#s5 .bx{position:absolute;left:190px;top:200px;width:700px;height:800px;mix-blend-mode:multiply}#s5 img{width:100%;height:100%;object-fit:contain}
#s5 .t{top:1100px;font-size:190px;color:var(--ink)}#s5 .k{top:1380px;font-size:46px;font-weight:600;color:var(--ink2)}
#bar{position:absolute;left:0;top:0;height:16px;background:var(--acc);width:0}
#foot{position:absolute;left:60px;width:960px;bottom:34px;text-align:center;font:500 24px/1.3 P;color:var(--ink);background:#ffffffcc;border-radius:16px;padding:10px 0;display:none}
</style>
<div class="sc" id="s1"><div class="t" id="a1"></div></div>
<div class="sc" id="s2"><div class="bx"><img id="p2"></div><div class="t k" id="k2"></div></div>
<div class="sc" id="s3"><div class="t" id="a3"></div></div>
<div class="sc" id="s4"><div class="t" id="a4"></div></div>
<div class="sc" id="s5"><div class="bx"><img id="p5"></div><div class="t" id="a5"></div><div class="t k" id="k5"></div></div>
<div id="bar"></div><div id="foot"></div>
<script src="common.js"></script><script src="product.js"></script><script>
$('a1').textContent=CP.brand;$('p2').src=CP.img;$('p5').src=CP.img;$('k2').textContent=CP.brand;$('a3').textContent=CP.name;$('a4').textContent=CP.detail;$('a5').textContent=CP.price;$('k5').textContent=CP.name;$('foot').textContent=CP.foot;
const CUTS=[0,1.3,3.2,5.3,7.2,9.5]; // 5 plans, dernier plus long
function render(t){
 let i=CUTS.findIndex((c,j)=>t>=c&&t<(CUTS[j+1]||99));if(i<0||i>4)i=4;
 for(let j=0;j<5;j++)$('s'+(j+1)).style.display=j===i?'block':'none';
 const lt=t-CUTS[i],k=e(lt/.35),el=$('s'+(i+1));
 // chaque plan entre par un glissement différent, le texte claque
 el.style.transform=['translateX('+(1-k)*-1080+'px)','translateY('+(1-k)*1920+'px)','scale('+(1.4-k*.4)+')','translateX('+(1-k)*1080+'px)','translateY('+(1-k)*-1920+'px)'][i];
 el.querySelectorAll('.t,.bx').forEach((x,n)=>{const q=e((lt-.2-n*.1)/.4);x.style.opacity=q;x.style.transform=`scale(${.85+q*.15})`});
 $('bar').style.width=(t/10.5*1080)+'px';$('foot').style.display=i===4?'block':'none';
}
render(0);
</script>
