<!doctype html><meta charset="utf-8"><style>
body{background:radial-gradient(circle at 50% 40%,var(--bg1),var(--ink))}
#wrap{left:140px;top:250px;width:800px;height:1240px;perspective:1600px}
#card{position:absolute;inset:0;border-radius:44px;background:linear-gradient(135deg,var(--bg0),#fff 40%,var(--bg1));border:16px solid var(--acc);box-shadow:0 50px 90px #0007;overflow:hidden;transform-style:preserve-3d}
#art{position:absolute;left:40px;top:150px;width:680px;height:700px;border-radius:20px;background:#fff;border:6px solid var(--ink);overflow:hidden}
#art img{width:100%;height:100%;object-fit:contain;padding:20px;box-sizing:border-box}
#hd{position:absolute;left:44px;top:34px;width:560px;font:700 56px/1.05 P;color:var(--ink)}
#tp{position:absolute;right:36px;top:36px;padding:12px 22px;border-radius:40px;background:var(--ink);color:#fff;font:700 40px P}
#br{position:absolute;left:44px;top:100px;font:600 28px P;letter-spacing:6px;color:var(--ink2);text-transform:uppercase}
#dtb{position:absolute;left:40px;top:890px;width:680px;height:230px;border-radius:20px;background:#ffffffd0;border:4px solid var(--ink);padding:28px 30px;box-sizing:border-box;font:500 42px/1.3 P;color:var(--ink)}
#dtb b{display:block;font:700 32px P;letter-spacing:5px;color:var(--acc);margin-bottom:8px;text-transform:uppercase}
#ft{position:absolute;left:40px;bottom:30px;font:500 26px P;color:var(--ink2)}
#sheen{position:absolute;inset:0;background:linear-gradient(115deg,#fff0 30%,#fff9 50%,#fff0 70%);transform:translateX(-120%)}
#foot{position:absolute;left:60px;width:960px;bottom:34px;text-align:center;font:500 22px/1.3 P;color:#fff}
</style>
<div class="a" id="wrap"><div id="card"><div id="hd"></div><div id="br"></div><div id="tp"></div><div id="art"><img id="prod"></div><div id="dtb"><b>Fiche</b><span id="dt"></span></div><div id="ft">BoostNaturel · Sélection du jour</div><div id="sheen"></div></div></div>
<div id="foot"></div>
<script src="common.js"></script><script src="product.js"></script><script>
$('prod').src=CP.img;$('hd').textContent=CP.name;$('br').textContent=CP.brand;$('tp').textContent=CP.price;$('dt').textContent=CP.detail;$('foot').textContent=CP.foot;
function render(t){
 const k=e(t/1.3),w=$('wrap');w.style.opacity=Math.min(1,k*3);
 const ry=(1-k)*540+Math.sin(t*1.1)*9,rx=Math.sin(t*.9)*4;
 w.style.transform=`translateY(${(1-k)*300}px) scale(${.7+k*.3})`;$('card').style.transform=`rotateY(${ry}deg) rotateX(${rx}deg)`;
 $('sheen').style.transform=`translateX(${-120+((t*60)%260)}%)`;
}
render(0);
</script>
