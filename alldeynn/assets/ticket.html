<!doctype html><meta charset="utf-8"><style>
body{background:var(--bg1)}
#pp{left:170px;top:110px;width:740px;height:1640px;background:#fffdf7;box-shadow:0 30px 70px #0004;
 -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/40px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/40px 100%}
.ln{position:absolute;left:230px;width:620px;font:600 38px/1.2 P;color:#222;letter-spacing:2px;white-space:nowrap;overflow:hidden}
.dash{position:absolute;left:230px;width:620px;border-top:4px dashed #bbb;opacity:0}
#bx{left:290px;top:280px;width:500px;height:500px;mix-blend-mode:multiply}#prod{width:100%;height:100%;object-fit:contain}
#l1{top:170px;text-align:center;font-size:44px;letter-spacing:8px;font-weight:700}
#d1{top:250px}
#l2{top:830px;font-weight:700;font-size:44px;white-space:normal;line-height:1.1}
#l3{top:980px;color:#666;font-size:32px;white-space:normal}
#d2{top:1130px}
#l4{top:1170px;font-size:34px}#l5{top:1260px;font-size:34px}
#d3{top:1350px}
#l6{top:1390px;font-size:88px;font-weight:700;text-align:right;color:var(--ink)}
#l7{top:1550px;font-size:30px;text-align:center;color:#666;white-space:normal}
#foot{position:absolute;left:60px;width:960px;bottom:34px;text-align:center;font:500 22px/1.3 P;color:var(--ink2)}
</style>
<div class="a" id="pp"></div><div class="a" id="bx"><img id="prod"></div>
<div class="ln a" id="l1"></div><div class="dash" id="d1"></div>
<div class="ln a" id="l2"></div><div class="ln a" id="l3"></div>
<div class="dash" id="d2"></div><div class="ln a" id="l4"></div><div class="ln a" id="l5"></div><div class="dash" id="d3"></div>
<div class="ln a" id="l6"></div><div class="ln a" id="l7"></div><div id="foot"></div>
<script src="common.js"></script><script src="product.js"></script><script>
$('prod').src=CP.img;$('foot').textContent=CP.foot;
const T={l1:'BOOSTNATUREL',l2:'1 x '+CP.name,l3:CP.brand+' · '+CP.detail,l4:'Livraison offerte dès 100 €',l5:'Livraison en 2 à 5 jours ouvrés',l6:CP.price,l7:'Merci et à bientôt !'};
const ORDER=[['l1',1.2],['l2',2.8],['l3',3.6],['l4',4.8],['l5',5.4],['l6',6.2],['l7',7.2]];
function render(t){
 const k=e(t/1);$('pp').style.opacity=1;$('pp').style.transform=`translateY(${(1-k)*-1800}px)`;
 const bk=e((t-1.8)/.6);$('bx').style.opacity=bk;$('bx').style.transform=`scale(${.7+bk*.3})`;
 ORDER.forEach(([id,a],i)=>{const el=$(id),s=T[id],n=Math.max(0,Math.min(s.length,Math.floor((t-a)*28)));el.style.opacity=t>=a?1:0;el.textContent=s.slice(0,n)+(n<s.length&&t>=a&&Math.floor(t*4)%2?'▌':'')});
 [['d1',1.5],['d2',4.4],['d3',6]].forEach(([id,a])=>{$(id).style.opacity=t>=a?1:0});
}
render(0);
</script>
