<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:P;font-weight:500;src:url(p500.ttf)}
@font-face{font-family:P;font-weight:600;src:url(p600.ttf)}
@font-face{font-family:P;font-weight:700;src:url(p700.ttf)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:P}
body{position:relative;background:linear-gradient(var(--bg0),var(--bg1))}
.a{position:absolute;opacity:0;will-change:transform,opacity}
#brand{top:110px;left:0;width:1080px;text-align:center;font:700 40px P;letter-spacing:10px;color:#fff;opacity:1}
#glow{left:90px;top:520px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,#fff 35%,#fff0 70%)}
#sh{left:340px;top:1260px;width:400px;height:50px;border-radius:50%;background:var(--ink);filter:blur(24px)}
#prod{left:215px;top:560px;width:650px;height:650px;mix-blend-mode:multiply}
.num{left:70px;top:230px;width:190px;height:190px;border-radius:50%;background:var(--ink);color:#fff;font:700 120px/190px P;text-align:center}
.txt{left:290px;top:250px;width:720px;font:700 70px/1.12 P;color:var(--ink)}
.sub{left:290px;top:420px;width:720px;font:500 40px/1.3 P;color:var(--ink2)}
.fr{width:260px;height:260px}
.big{left:60px;width:960px;text-align:center;color:var(--ink);font:700 100px/1.1 P}
#cta{left:190px;top:1560px;width:700px;height:120px;border-radius:60px;background:var(--ink);color:#fff;font:700 52px/120px P;text-align:center}
#foot{left:60px;top:1790px;width:960px;text-align:center;font:500 28px/1.3 P;color:var(--ink2);opacity:1}
</style>
<div id="brand" class="a">ALLDEYNN</div>
<div id="glow" class="a"></div><div id="sh" class="a"></div><img id="prod" class="a">
<div class="a big" id="h1" style="top:230px"></div>
<div id="steps"></div>
<div class="a fr" id="f1" style="left:80px;top:1300px"></div><div class="a fr" id="f2" style="left:740px;top:1330px"></div>
<div class="a big" id="end" style="top:1330px;font-size:80px"></div>
<div class="a" id="cta">boostnaturel.com</div>
<div id="foot" class="a"></div>
<script src="products.js"></script><script>
const $=id=>document.getElementById(id);
$('prod').src=C.img;$('h1').innerHTML=STEPH;$('end').textContent=C.name+' · '+C.price;$('end').style.fontSize=Math.min(80,Math.floor(940/((C.name.length+9)*0.58)))+'px';$('foot').textContent=C.foot;
if(C.stepsFruit)C.fruits.forEach((k,i)=>$('f'+(i+1)).innerHTML=fruitSVG(k));
const e=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
const pop=x=>{const q=Math.min(1,Math.max(0,x));return q<1?e(q)*1.12-Math.sin(q*3.14)*0.12:1};
const S=C.steps.map((s,i)=>[i+1,s[0],s[1],3.0+i*3.4,6.4+i*3.4]);
const W=$('steps');
S.forEach(s=>{const mk=(c,h)=>{const d=document.createElement('div');d.className='a '+c;d.innerHTML=h;W.appendChild(d);return d};
 s.push(mk('num',s[0]),mk('txt',s[1]),mk('sub',s[2]))});
const A=(el,t,a,b,dy,dx=0)=>{const k=e((t-a)/0.5),o=t<a?0:Math.min(k,e((b-t)/0.3));el.style.opacity=o;el.style.transform=`translate(${(1-k)*dx}px,${(1-k)*dy}px)`};
function render(t){
 const rise=e(t/1.0),y=(1-rise)*500+Math.sin(t*1.8)*14,rot=Math.sin(t*1.1)*1.6;
 ['glow','sh'].forEach(i=>$(i).style.opacity=rise);
 const p=$('prod');p.style.opacity=rise;p.style.transform=`translateY(${y}px) rotate(${rot}deg)`;
 A($('h1'),t,0.3,2.8,50);
 S.forEach(s=>{A(s[5],t,s[3],s[4],0,-60);A(s[6],t,s[3]+0.15,s[4],40);A(s[7],t,s[3]+0.3,s[4],40);
  if(t>=s[3]&&t<s[4])s[5].style.transform+=` scale(${pop((t-s[3])/0.5)})`});
 if(C.stepsFruit)C.fruits.forEach((_,i)=>{const el=$('f'+(i+1)),a=6.9+i*0.25,q=pop((t-a)/0.5);el.style.opacity=t<a?0:Math.min(1,q*2,e((9.8-t)/0.35));el.style.transform=`scale(${q}) rotate(${(i?10:-12)+Math.sin(t*2+a)*3}deg)`});
 A($('end'),t,13.4,16,40);A($('cta'),t,13.8,16,40);
}
render(0);
</script>
