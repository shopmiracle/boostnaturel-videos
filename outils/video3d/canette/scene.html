<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style>
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script></head>
<body>
<script type="module">
// Animation « canette » en plans coupés : étiquette déroulée sur 360° (photo réelle) + profil mesuré sur la photo.
import * as THREE from 'three';
import { RoomEnvironment } from './RoomEnvironment.js';
import { RoundedBoxGeometry } from './RoundedBoxGeometry.js';

const prof = await (await fetch('cfg/c4-profile.json')).json();
const W = 1080, H = 1920, FPS = 30, DUR = 16, N = DUR * FPS;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(32, W / H, 0.05, 80);
let seed = 4242; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const ease = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
const lerp = (a, b, x) => a + (b - a) * x;

// fonds dégradés (plein écran)
const grad = (top, bottom, glow) => { const c = document.createElement('canvas'); c.width = 270; c.height = 480; const g = c.getContext('2d');
  const l = g.createLinearGradient(0, 0, 0, 480); l.addColorStop(0, top); l.addColorStop(1, bottom); g.fillStyle = l; g.fillRect(0, 0, 270, 480);
  if (glow) { const r = g.createRadialGradient(135, 230, 0, 135, 230, 200); r.addColorStop(0, glow); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, 270, 480); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; };
const BG = { blueGlow: grad('#1d4fc4', '#0b2a7a', 'rgba(220,236,255,0.95)'), yellow: grad('#fff4b8', '#ffc400'), blue: grad('#6fb2ff', '#1f5fd6'),
  orange: grad('#ffe08a', '#ff9f1c'), sky: grad('#cfe6ff', '#3a7be8'), floor: grad('#2c6fe0', '#a9d0ff') };

// ---------- canette ----------
const tex = await new THREE.TextureLoader().loadAsync('img/c4-label.png');
tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
const HC = 2.5, DIAM = HC / prof.aspect, R0 = DIAM / 2;
const rows = prof.rows.filter((_, i) => i % 2 === 0);
const sm = rows.map((r, i) => { let s = 0, n = 0; for (let k = -2; k <= 2; k++) { const q = rows[i + k]; if (q) { s += q[0]; n++; } } return s / n; });
const pts = rows.map((r, i) => new THREE.Vector2(Math.max(0.05, sm[i] * R0), HC * (1 - (r[1] - prof.y0) / (prof.y1 - prof.y0)))).reverse();
const labelMat = new THREE.MeshPhysicalMaterial({ map: tex, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 0.4, roughness: 0.32, metalness: 0.1, clearcoat: 0.5, clearcoatRoughness: 0.15 });
const labelLite = new THREE.MeshStandardMaterial({ map: tex, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 0.4, roughness: 0.32, metalness: 0.1 });
const metal = new THREE.MeshStandardMaterial({ color: 0xdfe4ea, metalness: 1, roughness: 0.2 });
function makeCan(drops) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.LatheGeometry(drops ? pts : pts.filter((_, i) => i % 3 === 0 || i === pts.length - 1), drops ? 160 : 72, Math.PI, Math.PI * 2), drops ? labelMat : labelLite); body.castShadow = !!drops; g.add(body);
  const top = pts[pts.length - 1], bot = pts[0];
  const rim = new THREE.Mesh(new THREE.TorusGeometry(top.x * 0.97, 0.03, 16, 96), metal); rim.rotation.x = Math.PI / 2; rim.position.y = top.y + 0.01; g.add(rim);
  const lid = new THREE.Mesh(new THREE.CircleGeometry(top.x * 0.95, 64), metal); lid.rotation.x = -Math.PI / 2; lid.position.y = top.y - 0.02; g.add(lid);
  const tab = new THREE.Mesh(new RoundedBoxGeometry(top.x * 0.5, 0.018, top.x * 0.3, 2, 0.008), metal); tab.position.set(0, top.y - 0.005, top.x * 0.28); g.add(tab);
  const bring = new THREE.Mesh(new THREE.TorusGeometry(bot.x * 0.9, 0.035, 16, 96), metal); bring.rotation.x = Math.PI / 2; bring.position.y = bot.y + 0.02; g.add(bring);
  const dome = new THREE.Mesh(new THREE.SphereGeometry(bot.x * 1.1, 48, 12, 0, Math.PI * 2, 0, 0.75), metal); dome.position.y = bot.y + bot.x * 0.62; dome.rotation.x = Math.PI; g.add(dome);
  if (drops) {
    const n = 280, im = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 14, 10), new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.02, transparent: true, opacity: 0.38, clearcoat: 1, envMapIntensity: 3 }), n);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
    for (let i = 0; i < n; i++) {
      const a = (rnd() - 0.5) * Math.PI * 1.3, y = 0.25 + rnd() * (HC - 0.7), r = R0 + 0.004, k = 0.006 + Math.pow(rnd(), 2.5) * 0.026;
      p.set(Math.sin(a) * r, y, Math.cos(a) * r); q.setFromUnitVectors(new THREE.Vector3(0, 0, 1), new THREE.Vector3(Math.sin(a), 0, Math.cos(a)));
      s.set(k, k * 1.25, k * 0.45); m.compose(p, q, s); im.setMatrixAt(i, m);
    }
    g.add(im);
  }
  return g;
}
const can = makeCan(true); scene.add(can);
const line = [-1.2, 0, 1.2].map((x, i) => { const c = makeCan(false); c.position.set(x, 0, i === 1 ? 0.35 : 0); c.rotation.y = [-0.4, 0, 0.4][i]; scene.add(c);
  const r = c.clone(); r.scale.y = -1; r.position.y = 0; scene.add(r); return [c, r]; });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x7fb2ff, roughness: 0.25, metalness: 0.1, transparent: true, opacity: 0.8 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; floor.renderOrder = 2; scene.add(floor);

// ---------- lumières ----------
scene.add(new THREE.HemisphereLight(0xffffff, 0x8899bb, 0));
const hemi = scene.children[scene.children.length - 1];
const tgt = new THREE.Object3D(); scene.add(tgt);
const key = new THREE.SpotLight(0xffffff, 0, 30, 0.5, 0.6, 1.2); key.position.set(-3, 5, 6); key.target = tgt; key.castShadow = true; key.shadow.mapSize.set(1024, 1024); scene.add(key);
const rimA = new THREE.SpotLight(0xffffff, 0, 20, 0.6, 0.7, 1.2); rimA.position.set(3.5, 3, -3); rimA.target = tgt; scene.add(rimA);
const rimB = new THREE.SpotLight(0xbfe0ff, 0, 20, 0.6, 0.7, 1.2); rimB.position.set(-3.5, 2, -3); rimB.target = tgt; scene.add(rimB);

// ---------- particules givrées (chute) ----------
const NP = 70, parts = new THREE.InstancedMesh(new RoundedBoxGeometry(1, 1, 1, 2, 0.18), new THREE.MeshPhysicalMaterial({ roughness: 0.15, clearcoat: 1, transparent: true, opacity: 0.85 }), NP);
const pcol = [new THREE.Color('#ffffff'), new THREE.Color('#e63946'), new THREE.Color('#2f6bff'), new THREE.Color('#cfefff')];
const ppar = Array.from({ length: NP }, (_, i) => { parts.setColorAt(i, pcol[i % 4]); return [rnd(), rnd(), rnd(), rnd(), 0.05 + rnd() * 0.12]; });
scene.add(parts);

// ---------- plans ----------
const SHOTS = [
  { t: [0, 1.8], bg: 'blueGlow', lit: 0, cam: [[0, 0.35, 4.6], [0, 0.45, 4.1]], look: [0, 1.45, 0], can: tt => ({ p: [0, 0, 0], r: [0, 0.15 * tt, 0] }) },
  { t: [1.8, 3.4], bg: 'yellow', lit: 1, cam: [[0, 1.3, 6.4], [0, 1.3, 6.0]], look: [0, 1.3, 0], can: tt => ({ p: [0, 0.05 + 0.05 * Math.sin(tt * 6), 0], r: [0, Math.PI * 2 * ease(tt), 0.32] }) },
  { t: [3.4, 5.0], bg: 'blue', lit: 1, cam: [[-0.9, 1.5, 3.4], [0.45, 1.45, 3.05]], look: [0, 1.3, 0], can: tt => ({ p: [0, 0, 0], r: [0, -0.35 + 0.3 * tt, 0] }) },
  { t: [5.0, 6.6], bg: 'orange', lit: 1, cam: [[0.3, -1.0, 3.6], [-0.2, -0.8, 3.3]], look: [0, 0.9, 0], can: tt => ({ p: [0, 0.4, 0], r: [-0.45, 0.4 + 0.7 * tt, 0.15] }) },
  { t: [6.6, 8.4], bg: 'sky', lit: 1, parts: true, cam: [[0, 1.25, 7.2], [0, 1.25, 7.0]], look: [0, 1.25, 0], can: tt => ({ p: [lerp(-1.7, 1.5, tt), lerp(1.9, -0.2, tt), 0], r: [0.4 * tt, 2.2 * tt, lerp(0.9, -1.6, tt)] }) },
  { t: [8.4, 11.2], bg: 'yellow', lit: 1, cam: [[0, 1.3, 7.6], [0, 1.3, 6.8]], look: [0, 1.25, 0], can: tt => ({ p: [0, 0, 0], r: [0, lerp(-1.2, 1.2, ease(tt)), 0] }) },
  { t: [11.2, 12.8], bg: 'blueGlow', lit: 0, cam: [[0.6, 0.55, 4.8], [0.3, 0.6, 4.4]], look: [0, 1.4, 0], can: tt => ({ p: [0, 0, 0], r: [0, 0.4 * tt, 0] }) },
  { t: [12.8, 16.01], bg: 'floor', lit: 1, lineup: true, cam: [[0, 1.0, 11.8], [0, 1.15, 10.2]], look: [0, 1.15, 0] },
];
window.__cuts = SHOTS.slice(1).map(s => s.t[0]);
const e = new THREE.Euler();
window.renderFrame = (f, q = 0.95) => {
  const t = f / FPS, S = SHOTS.find(s => t >= s.t[0] && t < s.t[1]), tt = (t - S.t[0]) / (S.t[1] - S.t[0]);
  scene.background = BG[S.bg];
  const lit = S.lit; key.intensity = 45 * lit; rimA.intensity = 70; rimB.intensity = 45 * lit; hemi.intensity = 0.15 * lit;
  scene.environmentIntensity = lit ? 0.25 : 0.12; renderer.toneMappingExposure = lit ? 0.85 : 0.8;
  labelMat.emissiveIntensity = labelLite.emissiveIntensity = lit ? 0.4 : 0.12; key.castShadow = !S.lineup;
  can.visible = !S.lineup; floor.visible = !!S.lineup; line.forEach(([c, r]) => { c.visible = r.visible = !!S.lineup; });
  if (!S.lineup) { const st = S.can(tt); can.position.set(...st.p); e.set(...st.r, 'XYZ'); can.quaternion.setFromEuler(e); }
  parts.visible = !!S.parts;
  if (S.parts) { const m = new THREE.Matrix4(), qq = new THREE.Quaternion(), p = new THREE.Vector3(), sc = new THREE.Vector3();
    ppar.forEach((a, i) => { const k = (tt * (1.2 + a[3]) + a[0]) % 1.4 - 0.2; p.set(lerp(-3.2, 3.2, k) + (a[1] - 0.5) * 1.5, lerp(3.6, -1.2, k) + (a[2] - 0.5) * 2.5, (a[3] - 0.5) * 3 + 0.6);
      qq.setFromEuler(new THREE.Euler(t * 3 * a[1], t * 2 * a[2], t * a[3])); sc.setScalar(a[4]); m.compose(p, qq, sc); parts.setMatrixAt(i, m); });
    parts.instanceMatrix.needsUpdate = true; }
  const cp = S.cam[0].map((v, i) => lerp(v, S.cam[1][i], ease(tt)));
  camera.position.set(...cp); tgt.position.set(...S.look); camera.lookAt(...S.look);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/jpeg', q);
};
window.__bounces = []; window.__N = N; window.__ready = true;
</script></body></html>
