<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b0b10;font-family:Inter,Arial,sans-serif}
#st{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0b0b10}
.L{position:absolute;inset:0;overflow:hidden}
.w900{font-weight:900}
#a1{position:absolute;left:0;width:1080px;top:760px;text-align:center;font-size:184px;font-weight:900;letter-spacing:-9px;color:#ff7a2f;line-height:1}
#a2{background:#ff7a2f}
#a2 div{position:absolute;left:0;width:1080px;text-align:center;font-size:196px;font-weight:900;letter-spacing:-9px;line-height:1;white-space:nowrap}
.bk{color:#0b0b10}.bko{color:transparent;-webkit-text-stroke:5px #0b0b10}
#a3w{position:absolute;left:-260px;top:-260px;width:1600px;transform-origin:800px 1220px}
#a3w div{font-size:178px;font-weight:900;letter-spacing:-6px;line-height:1.0;white-space:nowrap}
.of{color:#ff7a2f}.oo{color:transparent;-webkit-text-stroke:5px #ff7a2f}
#fl{background:#fff}
.vb{position:absolute;left:30px;font-size:530px;font-weight:900;letter-spacing:-32px;line-height:1;height:540px;white-space:nowrap;
 background-image:url(creme.jpg);background-repeat:no-repeat;-webkit-background-clip:text;background-clip:text;color:transparent;transform-origin:520px 280px}
#bt{position:absolute;left:60px;top:1420px;padding:22px 42px;border-radius:60px;background:#ff7a2f;color:#fff;font-size:44px;font-weight:900}
#cw{position:absolute;left:-40px;top:0;width:1200px}
#cw div{font-size:300px;font-weight:900;letter-spacing:-10px;line-height:.9;color:transparent;-webkit-text-stroke:3px #ffffff22;white-space:nowrap}
#gl{position:absolute;left:150px;top:420px;width:780px;height:780px;border-radius:50%;background:#ff7a2f;filter:blur(160px)}
#pr{position:absolute;height:1000px;left:186px;top:220px;transform-origin:50% 60%;filter:drop-shadow(0 50px 60px #000)}
#c1{position:absolute;left:0;width:1080px;top:1280px;text-align:center;color:#fff;font-size:64px;font-weight:900;letter-spacing:-1px}
#c2{position:absolute;left:290px;width:500px;top:1395px;text-align:center;padding:26px 0;border-radius:70px;background:#fff;color:#0b0b10;font-size:46px;font-weight:900}
</style></head><body><div id="st">
<div class="L" id="LA1"><div id="a1">TROPICAL</div></div>
<div class="L" id="a2"><div class="bk" style="top:560px">TROPICAL</div><div class="bko" style="top:760px">TROPICAL</div><div class="bk" style="top:960px">TROPICAL</div></div>
<div class="L" id="LA3"><div id="a3w"></div></div>
<div class="L" id="LB"><div class="vb" id="v1" style="top:420px">VI</div><div class="vb" id="v2" style="top:860px">BES</div><div id="bt">Beef-XP</div></div>
<div class="L" id="LC"><div id="cw"></div><div id="gl"></div><img id="pr" src="prod.png"><div id="c1">Applied Nutrition · 1,8 kg</div><div id="c2">boostnaturel.com</div></div>
<div class="L" id="fl"></div>
</div><script>
const $=i=>document.getElementById(i),cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),sg=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,ob=x=>{const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const rows=[];for(let i=0;i<14;i++){const d=document.createElement('div');d.className=i%2?'oo':'of';d.textContent='TROPICAL TROPICAL TROPICAL';$('a3w').appendChild(d);rows.push(d)}
for(let i=0;i<9;i++){const d=document.createElement('div');d.textContent=i%2?'VIBES':'TROPICAL';$('cw').appendChild(d)}
const punch=(t,beats,amp,k=12)=>{let v=0;for(const b of beats){if(t>=b)v=Math.max(v,amp*Math.exp(-k*(t-b)))}return v};
const show=(id,on)=>{$(id).style.display=on?'block':'none'};
function render(t){
 show('LA1',t<.5); show('a2',t>=.5&&t<1); show('LA3',t>=1&&t<2); show('LB',t>=2&&t<4.2); show('LC',t>=3.9);
 // A1
 $('a1').style.transform=`scale(${1+.12*Math.exp(-11*t)})`;
 // A2
 [...$('a2').children].forEach((d,i)=>{const u=eo(sg(t,.5+i*.07,.72+i*.07));d.style.transform=`translateX(${(1-u)*(i%2?900:-900)}px)`});
 // A3 bands
 const v=t-1;rows.forEach((d,i)=>{const dir=i%2?1:-1;d.style.transform=`translateX(${-700+dir*(v*700+v*v*500)+(i%3)*90}px)`;d.className=(t>=1.5?(i%2?'of':'oo'):(i%2?'oo':'of'))});
 $('a3w').style.transform=`rotate(-9deg) scale(${1+.35*eio(sg(t,1.7,2))})`;
 // B
 const s=1500+180*sg(t,2,4),y0=-210-140*sg(t,2,4),x0=520-s*.5;
 const p=punch(t,[2.5,3,3.5],.05);
 const zt=eio(sg(t,3.75,4.15)),zs=1+2.6*zt,zo=1-sg(t,3.9,4.15);
 const v1=$('v1'),v2=$('v2');
 v1.style.backgroundSize=v2.style.backgroundSize=s+'px auto';
 v1.style.backgroundPosition=`${x0}px ${y0}px`;v2.style.backgroundPosition=`${x0}px ${y0-440}px`;
 v1.style.transform=`scale(${(1+.3*Math.exp(-12*Math.max(0,t-2)))*(1+p)*zs})`;
 const bx=(1-eo(sg(t,2.25,2.5)))*1150;v2.style.opacity=t>=2.25?1:0;
 v2.style.transform=`translateX(${bx}px) scale(${(1+p)*zs})`;v2.style.transformOrigin=`520px ${280-440}px`;
 v1.style.opacity=zo;if(t>=2.25)v2.style.opacity=zo;
 $('bt').style.opacity=sg(t,2.6,2.75)*(1-sg(t,3.7,3.85));$('bt').style.transform=`scale(${ob(sg(t,2.6,2.9))})`;
 // C
 const cp=punch(t,[4.5,5,5.5,6,6.5,7,7.5],.025,10);
 $('pr').style.opacity=sg(t,3.95,4.2);
 $('pr').style.transform=`translateY(${Math.sin((t-4)*2.2)*10}px) scale(${(.82+.18*eo(sg(t,3.95,4.6)))*(1+cp)})`;
 $('gl').style.opacity=sg(t,4,4.4)*(.45+3*cp);
 $('cw').style.opacity=sg(t,4.1,4.6);$('cw').style.transform=`translateY(${-60-(t-4)*70}px)`;
 $('c1').style.opacity=sg(t,4.8,5.15);$('c1').style.transform=`translateY(${(1-eo(sg(t,4.8,5.15)))*50}px)`;
 $('c2').style.opacity=sg(t,5.4,5.55);$('c2').style.transform=`scale(${ob(sg(t,5.4,5.8))})`;
 // flashes on hard cuts
 let f=0;for(const b of [1.5,2,4]){if(t>=b&&t<b+.12)f=Math.max(f,.85*(1-(t-b)/.12))}
 $('fl').style.opacity=f;
}
render(0);
</script></body></html>
